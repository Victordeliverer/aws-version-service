plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
    id 'maven-publish'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // This dependency is used by the application.
    implementation libs.guava
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'com.victordeliverer.versionservice.App'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}

group = 'com.victordeliverer'
version = System.getenv('APP_VERSION') ?: '0.1.0-SNAPSHOT'

jar {
    archiveBaseName = 'aws-version-service'
    manifest {
        attributes 'Main-Class': application.mainClass.get(),
                   'Implementation-Version': project.version
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'aws-version-service'
            from components.java
        }
    }
    repositories {
        if (System.getenv('CODEARTIFACT_URL')) {
            maven {
                url = uri(System.getenv('CODEARTIFACT_URL'))
                credentials {
                    username = 'aws'
                    password = System.getenv('CODEARTIFACT_AUTH_TOKEN')
                }
            }
        }
    }
}